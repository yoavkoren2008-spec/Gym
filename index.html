<script>
  // hide the bottom nav while the keyboard is open so it never covers inputs
  document.addEventListener('focusin', function (e) { if (e.target.matches('input, textarea, select')) document.body.classList.add('typing'); });
  document.addEventListener('focusout', function () { setTimeout(function () { var a = document.activeElement; if (!a || !a.matches('input, textarea, select')) document.body.classList.remove('typing'); }, 60); });
  App.boot();
</script>
